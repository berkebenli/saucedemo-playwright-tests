name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build SauceDemo.Tests

      - name: Install Playwright browsers
        run: pwsh SauceDemo.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test SauceDemo.Tests --no-build
